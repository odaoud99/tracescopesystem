services:
  tracescope:
    build:
      context: .
      dockerfile: Dockerfile
    image: tracescope:local
    ports:
      - "127.0.0.1:${TRACESCOPE_PORT:-4173}:4173"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      TRACESCOPE_CONFIG_DIR: /data
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AGENTMAIL_API_KEY: ${AGENTMAIL_API_KEY:-}
      AGENTMAIL_INBOX_ID: ${AGENTMAIL_INBOX_ID:-}
    volumes:
      - tracescope_data:/data
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  tracescope_data:
